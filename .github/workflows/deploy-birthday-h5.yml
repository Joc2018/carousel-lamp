name: Deploy birthday H5 to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['birthday-h5/**', '.github/workflows/deploy-birthday-h5.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: birthday-h5-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: birthday-h5
      - id: deployment
        uses: actions/deploy-pages@v4
